version: "3"

services:

  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    container_name: imet_offline_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/logs:/var/log/nginx
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      args:
        - COMPOSER_GITHUB_TOKEN=${COMPOSER_GITHUB_TOKEN}
        - UID=${UID-}
    image: imet_offline_php_image
    container_name: imet_offline_php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ../imet-core/:/var/www/packages/imet-core
      - ../modular-forms/:/var/www/packages/modular-forms

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        - UID=${UID-}
    container_name: imet_offline_node
    volumes:
      - ./:/var/www/html

  composer:
    image: imet_offline_php_image
    depends_on:
      - php
    container_name: imet_offline_composer
    profiles:
      - development # this ensures the container is not created when launching "docker-compose up"
    volumes:
      - ./:/var/www/html
      - ../imet-core/:/var/www/packages/imet-core
      - ../modular-forms/:/var/www/packages/modular-forms
    entrypoint: [ 'composer' ]
    # NOTE:  It is possible to launch composer command using this container.
    # Ex. docker-compose run --rm composer update

  artisan:
    image: imet_offline_php_image
    depends_on:
      - php
    container_name: imet_offline_artisan
    profiles:
      - development
    volumes:
      - ./:/var/www/html
    entrypoint: [ 'php', 'artisan' ]

  test:
    image: imet_offline_php_image
    depends_on:
      - php
    container_name: imet_offline_phpunit
    profiles:
      - development
    volumes:
      - ./:/var/www/html
    #entrypoint: [ 'vendor/bin/phpunit' ]
    entrypoint: [ 'php', 'artisan', 'test' ]

  npm:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        - UID=${UID-}
    profiles:
      - development
    container_name: imet_offline_npm
    volumes:
      - ./:/var/www/
    working_dir: /var/www/
    entrypoint: [ 'npm' ]

  db:
    image: postgres:9.6
    container_name: imet_offline_db
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST_AUTH_METHOD=trust
      - LC_COLLATE=C.UTF-8
      - LC_CTYPE=C.UTF-8
    command: -p ${DB_PORT}
    # NOTE: The first time the container is launched (docker-compose up), it might take some time to create the db; during
    # this time the connection may be unavailable.
    #
    # Populate DB with: docker-compose run --rm artisan imet:init_db

