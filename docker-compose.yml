name: 'imet_offline'

services:

  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/logs:/var/log/nginx
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      args:
        - COMPOSER_GITHUB_TOKEN=${COMPOSER_GITHUB_TOKEN}
        - UID=${UID-}
    image: ${COMPOSE_PROJECT_NAME}_php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ../imet-core/:/var/www/packages/imet-core
      - ../modular-forms/:/var/www/packages/modular-forms

  composer:
    image: ${COMPOSE_PROJECT_NAME}_php
    depends_on:
      - php
    profiles:
      - development # this ensures the container is not created when launching "docker-compose up"
    volumes:
      - ./:/var/www/html
      - ../imet-core/:/var/www/packages/imet-core
      - ../modular-forms/:/var/www/packages/modular-forms
    entrypoint: [ 'composer' ]
    # NOTE:  It is possible to launch composer command using this container.
    # Ex. docker-compose run --rm composer update

  artisan:
    image: ${COMPOSE_PROJECT_NAME}_php
    depends_on:
      - php
    profiles:
      - development
    volumes:
      - ./:/var/www/html
      - ../imet-core/:/var/www/packages/imet-core
      - ../modular-forms/:/var/www/packages/modular-forms
    entrypoint: [ 'php', 'artisan' ]

  test:
    image: ${COMPOSE_PROJECT_NAME}_php
    depends_on:
      - php
    profiles:
      - development
    volumes:
      - ./:/var/www/html
      - ../imet-core/:/var/www/packages/imet-core
      - ../modular-forms/:/var/www/packages/modular-forms
    #entrypoint: [ 'vendor', 'bin', 'phpunit' ]
    entrypoint: [ 'php', 'artisan', 'test' ]

  npm:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        - UID=${UID-}
    image: ${COMPOSE_PROJECT_NAME}_node
    volumes:
      - ./:/var/www/html/
      - ../imet-core/:/var/www/packages/imet-core
      - ../modular-forms/:/var/www/packages/modular-forms
    profiles:
      - development
    entrypoint: [ 'npm' ]
